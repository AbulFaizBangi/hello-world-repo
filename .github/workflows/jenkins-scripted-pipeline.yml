name: Scripted Pipeline
 
on:
  push:
    branches:
      - feature-testingbranch

jobs:
  Greet:
    runs-on: ubuntu-latest
    steps:
      - name: Greet
        run: echo 'Hello, World!'

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: |
          echo 'Pretending to build...'
          sleep 5s

  Results:
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: |
          echo "Job completed at $(date)"
